<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
  :root{--bg:#0a0d0a;--panel:#141a14;--line:#243024;--ink:#f3f5f1;--muted:#9aa79a;--green:#4ade80;--green-d:#22c55e;--amber:#fbbf24;--max:980px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 20px}
  .wrap.wide{max-width:1440px}
  a{color:var(--green)}
  .top{position:sticky;top:0;z-index:600;background:rgba(10,13,10,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 0;font-size:14px}
  .top .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .top a{text-decoration:none;color:var(--muted)}.top a:hover{color:var(--green)}
  .langsw{margin-left:auto;display:flex;gap:2px}
  .langsw button{font:inherit;font-size:12.5px;font-weight:700;padding:5px 9px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;border-radius:7px;text-transform:uppercase;letter-spacing:.04em}
  .langsw button:hover{color:var(--green);border-color:var(--green)}
  .langsw button.on{background:var(--green-d);color:#05230f;border-color:var(--green-d)}
  header{padding:34px 0 22px;border-bottom:1px solid var(--line)}
  .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);font-weight:700;margin-bottom:11px}
  h1{font-size:clamp(24px,4vw,36px);line-height:1.12;font-weight:900;letter-spacing:-.02em;max-width:860px}
  .lede{margin-top:14px;color:#c9d1c5;font-size:16px;max-width:840px}
  .lede b{color:#fff}
  .callout{margin-top:16px;background:#1b1408;border:1px solid #5a4413;border-left:3px solid var(--amber);border-radius:12px;padding:14px 16px;color:#f0e6cf;font-size:14.5px;max-width:840px}
  .callout b{color:#fff}
  main{padding:22px 0 40px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi .n{font-size:23px;font-weight:900;letter-spacing:-.02em;color:#fff;line-height:1.1}
  .kpi .l{font-size:12px;color:var(--muted);margin-top:4px}
  .kpi.hot .n{color:#f87171}
  /* map shell */
  #shell{display:flex;gap:0;height:78vh;min-height:520px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
  #map{flex:1;min-width:0;background:#0d110d}
  #side{display:none}
  @media(max-width:900px){#shell{flex-direction:column;height:auto}#map{height:60vh;min-height:380px}#side{width:auto;border-left:0;border-top:1px solid var(--line);max-height:60vh}}
  #side h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;
    margin:18px 0 7px;border-top:1px solid var(--line);padding-top:12px}
  #side h2:first-child{border-top:0;margin-top:4px;padding-top:0}
  .item{padding:8px;border-radius:9px;cursor:pointer;border:1px solid transparent}
  .item:hover{background:#1b231b;border-color:var(--line)}
  .item b{font-weight:700;font-size:13.5px}
  .meta{color:var(--muted);font-size:12px}
  .pill{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:10px;margin-right:5px;vertical-align:1px;text-transform:uppercase;letter-spacing:.04em}
  .wind{background:#12314f;color:#8ec8ff}.solar{background:#4a3608;color:#fbbf24}
  .plan{background:#4a1414;color:#fca5a5}
  .ok{background:#0f3d1e;color:#86efac}.unk{background:#2a332a;color:#9aa79a}
  .note-small{font-size:12.5px;color:var(--muted);margin-top:10px}
  /* clean dark popups */
  .leaflet-popup-content-wrapper{background:#141a14;color:#e7ecdf;border:1px solid #2a352a;border-radius:14px;box-shadow:0 12px 38px rgba(0,0,0,.6)}
  .leaflet-popup-tip{background:#141a14;border:1px solid #2a352a}
  .leaflet-popup-content{font-size:13px;line-height:1.55;margin:0;padding:14px 16px;max-height:min(48vh,360px);overflow:auto;overscroll-behavior:contain}
  /* dark scrollbar inside the popup, same as the panel — the default light one
     cuts a white stripe down the right edge */
  .leaflet-popup-content{scrollbar-width:thin;scrollbar-color:#334133 transparent}
  .leaflet-popup-content::-webkit-scrollbar{width:8px}
  .leaflet-popup-content::-webkit-scrollbar-track{background:transparent}
  .leaflet-popup-content::-webkit-scrollbar-thumb{background:#334133;border-radius:8px;
    border:2px solid transparent;background-clip:content-box}
  .leaflet-popup-content::-webkit-scrollbar-thumb:hover{background:#4a5c4a;border:2px solid transparent;background-clip:content-box}
  .leaflet-popup-content h3{margin:0 0 9px;padding:0 30px 9px 0;font-size:15px;font-weight:800;letter-spacing:-.01em;color:#fff;border-bottom:1px solid #24302a}
  .leaflet-popup-content table{border-collapse:collapse;margin:8px 0 0;width:100%}
  .leaflet-popup-content td{padding:2px 12px 2px 0;vertical-align:top}
  .leaflet-popup-content td:first-child{color:var(--muted);white-space:nowrap}
  .leaflet-popup-content .note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5}
  .leaflet-popup-content a{color:var(--green)}
  /* sit the X to the left of the scrollbar, not on top of it */
  .leaflet-popup-close-button{color:var(--muted)!important;font-size:20px!important;padding:9px 10px 0 0!important;right:8px!important;top:2px!important}
  .leaflet-popup-close-button:hover{color:#fff!important}
  .leaflet-control-layers,.leaflet-bar a{background:#161d16;color:var(--ink);border-color:var(--line)}
  .leaflet-control-layers-expanded{font-size:12.5px;color:var(--ink)}
  .leaflet-bar a{color:var(--ink)}
  .leaflet-container{background:#0d110d}
  .lgd{background:rgba(10,13,10,.9);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.65;color:var(--ink)}
  .lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
  .zoomhint{max-width:230px;color:var(--muted);cursor:pointer}
  @media(pointer:coarse){.zoomhint{display:none}}
  h2.sec{font-size:clamp(19px,2.6vw,24px);font-weight:800;letter-spacing:-.01em;margin:34px 0 4px;padding-top:20px;border-top:1px solid var(--line)}
  .sect-sub{color:var(--muted);font-size:13.5px;margin-bottom:16px}
  .srcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
  .srccard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .srccard h4{font-size:13.5px;font-weight:800;margin-bottom:6px}
  .srccard p{font-size:13px;color:#c2cbbe}
  .srccard .who{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);font-weight:700;margin-bottom:7px}
  ul.lim{margin:10px 0 0 18px;font-size:13.5px;color:#c2cbbe}
  ul.lim li{margin-bottom:7px}
  footer{padding:40px 0 60px;border-top:1px solid var(--line);margin-top:30px;color:var(--muted)}
  .foot-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:26px}
  .foot-col h4{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:11px}
  .foot-col a{display:block;color:#dfe6da;text-decoration:none;padding:5px 0;font-size:14px;line-height:1.35}
  .foot-col a:hover{color:var(--green)}
  .disc{margin-top:24px;font-size:12.5px;color:#6f7a6f;border-top:1px solid var(--line);padding-top:16px;line-height:1.6}

  /* --- full-screen map shell + slide-in panel --- */
  html,body{height:100%}
  body{margin:0;overflow:hidden}
  #map{position:fixed;inset:0;width:100vw;height:100vh;background:#0d110d;z-index:0}
  #panelBtn{flex:none;width:30px;height:30px;border-radius:8px;
    background:transparent;border:0;color:var(--muted);cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  #panelBtn:hover{background:rgba(255,255,255,.07);color:var(--ink)}
  #panel{position:fixed;top:58px;right:12px;z-index:1000;width:340px;max-width:calc(100vw - 24px);
    max-height:calc(100vh - 80px);overflow:auto;background:rgba(16,20,16,.97);border:1px solid var(--line);
    border-radius:14px;padding:16px;backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.55)}
  #panel[hidden]{display:none}
  /* dark scrollbar — the default light one cuts a white stripe down the panel */
  #panel{scrollbar-width:thin;scrollbar-color:#334133 transparent}
  #panel::-webkit-scrollbar{width:10px;height:10px}
  #panel::-webkit-scrollbar-track{background:transparent}
  #panel::-webkit-scrollbar-thumb{background:#334133;border-radius:8px;
    border:3px solid transparent;background-clip:content-box}
  #panel::-webkit-scrollbar-thumb:hover{background:#4a5c4a;border:3px solid transparent;background-clip:content-box}
  #panel::-webkit-scrollbar-corner{background:transparent}
  #panelClose{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer;line-height:1}
  #panelClose:hover{color:var(--ink)}
  /* --- stats panel -----------------------------------------------------
     One spacing scale for the whole panel: 8px inside a card, 10px between
     cards, 16px between blocks. Every number is tabular so columns of digits
     line up instead of shimmering as the data changes. */
  #panel > * + *{margin-top:16px}
  /* #kpis carries the page-level .kpis grid class; inside the panel it is just a
     stack of three blocks, and the inherited auto-fit grid was what made the
     totals, the tabs and the cards sit at odd distances from each other. */
  #panel .kpis{display:block;margin:0;gap:0}
  #panel .kpis > * + *{margin-top:12px}
  #panel .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 13px}
  #panel .n,#panel .tot-n{font-variant-numeric:tabular-nums}

  #panel .tots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
  #panel .tot{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 13px}
  #panel .tot-n{font-size:24px;font-weight:800;color:#fff;line-height:1.1;letter-spacing:-.02em}
  #panel .tot-l{font-size:12px;color:var(--muted);margin-top:3px;text-transform:capitalize}

  /* segmented control: one track, the active item is a pill inside it */
  #panel .tabbtns{display:flex;gap:2px;background:rgba(255,255,255,.04);
    border:1px solid var(--line);border-radius:10px;padding:3px;margin:0}
  #panel .tabbtn{flex:1;font:inherit;font-size:12.5px;font-weight:600;padding:6px 8px;border-radius:7px;
    border:0;background:transparent;color:var(--muted);cursor:pointer;text-transform:capitalize;
    transition:background .12s,color .12s}
  #panel .tabbtn:hover{color:var(--ink);background:rgba(255,255,255,.05)}
  #panel .tabbtn.on{background:rgba(34,197,94,.16);color:var(--green)}
  #panel .kpis-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  #panel .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 13px}
  #panel .kpi .n{font-size:20px;font-weight:800;color:#fff;line-height:1.15;letter-spacing:-.02em}
  #panel .kpi .l{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35}
  #panel .kpi.hot .n{color:var(--red,#f87171)}
  #panel .foot-note{grid-column:1/-1;font-size:11.5px;line-height:1.45;color:var(--muted);margin-top:2px}

  /* layer control — the browser defaults look pasted in, so: real rows */
  #panel-layers{overflow:hidden}
  #panel-layers .leaflet-control{float:none;clear:both}
  #panel-layers .leaflet-control-layers{box-shadow:none;border:0;background:transparent;width:100%;margin:0;
    color:var(--ink);font:inherit}
  #panel-layers .leaflet-control-layers-expanded{padding:0}
  #panel-layers .leaflet-control-layers-list{margin:0}
  #panel-layers label{display:block;margin:0;border-radius:8px;cursor:pointer;transition:background .12s}
  #panel-layers label:hover{background:rgba(255,255,255,.05)}
  #panel-layers label > span,#panel-layers label > div{display:flex;align-items:center;gap:9px;padding:6px 8px}
  #panel-layers label span span{display:flex;align-items:center;gap:0;font-size:13px;line-height:1.3}
  #panel-layers input[type=checkbox],#panel-layers input[type=radio]{flex:none;width:15px;height:15px;margin:0;
    accent-color:var(--green-d);cursor:pointer}
  #panel-layers .leaflet-control-layers-separator{border-top:1px solid var(--line);margin:8px 0;height:0}
  #panel-layers .leaflet-control-layers-overlays{margin-top:2px}

  #burnbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 13px}
  #burnbox h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:0 0 8px}
  #burnbox .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;
    padding:6px 0;border-top:1px solid var(--line)}
  #burnbox .row:first-of-type{border-top:0;padding-top:0}
  #burnbox .row b{color:#fff;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  #burnbox .x{color:var(--green)}
  #burnbox .x.over{color:#f87171}
  #burnbox .cav{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:10px;
    padding-top:10px;border-top:1px solid var(--line)}

  /* top-right overlay controls: language toggle + stats button */
  #topctrls{position:fixed;top:12px;right:12px;z-index:1000;display:flex;align-items:center;gap:2px;
    background:rgba(16,20,16,.9);border:1px solid var(--line);border-radius:11px;padding:4px;
    backdrop-filter:blur(10px);box-shadow:0 6px 22px rgba(0,0,0,.45)}
  #topctrls .langsw{margin:0;gap:1px}
  #topctrls .langsw button{border:0;border-radius:8px;padding:0 9px;height:30px;background:transparent;
    color:var(--muted);font-size:11.5px;letter-spacing:.06em;transition:background .12s,color .12s}
  #topctrls .langsw button:hover{background:rgba(255,255,255,.07);color:var(--ink);border-color:transparent}
  #topctrls .langsw button.on{background:rgba(34,197,94,.16);color:var(--green);border-color:transparent}
  #topctrls .sep{flex:none;width:1px;height:18px;background:var(--line);margin:0 4px}
  .detailhint{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);
    font-size:11.5px;line-height:1.45;color:var(--muted)}
  #burnnote b{color:var(--ink);font-weight:700}
  /* Year strip for the national scar layer: one year is loaded at a time, so this
     is a single-select control, not twelve checkboxes — you cannot ask the map
     for 3 MB by accident. */
  #yearstrip{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  /* An ID selector setting display:flex outranks the UA sheet's [hidden]{display:none},
     so the strip would show through even when the layer is off. Restate it. */
  #yearstrip[hidden]{display:none}
  #yearstrip .lbl{font-size:11.5px;color:var(--muted);margin-right:2px}
  #yearstrip button{font:inherit;font-size:11.5px;line-height:1;padding:5px 7px;
    border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:6px;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
  #yearstrip button:hover{border-color:#3d4d3d;color:var(--ink)}
  /* Already in memory — clicking is instant. The strip brightening year by year is
     the only visible sign of the background prefetch, and it needs no explaining. */
  #yearstrip button.ready{color:var(--ink);border-color:#3d4d3d}
  #yearstrip button.on{background:#ea580c;border-color:#ea580c;color:#fff;font-weight:700}
  /* "All" is a mode, not a year — set apart from the run of dates so the strip
     does not read as though 2014-2025 had a thirteenth member. */
  #yearstrip button.all{margin-left:6px;letter-spacing:.02em}
  #yearstrip button.all::before{content:"";display:inline-block;width:1px;height:11px;
    background:var(--line);vertical-align:-2px;margin-right:8px}
  #yearstrip button.all.on::before{background:rgba(255,255,255,.45)}
  #yearstrip button.loading{opacity:.55}
  #yearstrip button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
  /* the credit line the tile licences require, at the smallest it can honestly be */
  .leaflet-control-attribution{background:transparent!important;color:#5d675d;font-size:10px;
    padding:0 6px 2px 0;text-shadow:0 1px 2px rgba(0,0,0,.7);box-shadow:none}
  .leaflet-control-attribution a{color:#77836f;text-decoration:none}
  .leaflet-control-attribution a:hover{color:var(--green)}
  .panel-links{clear:both;display:flex;flex-direction:column;gap:8px}
  .panel-link{color:var(--green);text-decoration:none;font-size:13.5px;line-height:1.4}
  .panel-link.home{color:var(--muted)}
  .panel-link:hover{text-decoration:underline}
  #panel .langsw{margin:0;display:flex;gap:2px}
</style>
<script defer data-domain="salvargardunha.com" src="https://analytics.hexgeta.com/script.js"></script>
</head>

<script>

var DATA_URL = '/dados/data.json';
var BURNS_URL = '/dados/burns.json';

/* ------------------------------------------------------------ interface */

pt:{
 top_home:'← salvargardunha.com', top_maps:'Mapas oficiais', top_docs:'Documentos', top_obj:'As 172 objeções',

 h1:'O mapa que o Governo não publicou',
 lede:'Todos os parques eólicos e centrais solares <b>já construídos, licenciados e aprovados</b> à volta da Serra da Gardunha, com a posição de cada aerogerador. Construído a partir dos registos oficiais e verificado cruzando-os uns contra os outros.',

function rowsOf(pairs){

    .map(function(p){return '<tr><td>'+esc(p[0])+'</td><td>'+p[1]+'</td></tr>';}).join('');
}

/* ----------------------------------------------------------------- map */
// OpenStreetMap (ODbL) and CARTO both require visible credit, so the control
// stays — but only the credit itself. prefix:false drops Leaflet's own flag and
// branding, which nothing obliges us to carry.
var map=L.map('map',{center:[40.08,-7.53],zoom:10,preferCanvas:true,
  minZoom:7,maxBounds:[[36.8,-9.9],[42.3,-6.0]],maxBoundsViscosity:1,
  attributionControl:false});
L.control.attribution({prefix:false,position:'bottomright'}).addTo(map);



/* Long field lists (a grid line crossing ten municipalities) make a tall popup.
   Leave room for the sticky top nav when auto-panning, keep it in view while the
   user drags, and always open scrolled to the title rather than mid-table. */
L.Popup.mergeOptions({maxWidth:340,keepInView:true,
  autoPanPaddingTopLeft:[14,72],autoPanPaddingBottomRight:[14,14]});
map.on('popupopen',function(e){
  var c=e.popup.getElement();
  var body=c&&c.querySelector('.leaflet-popup-content');
  if(body) body.scrollTop=0;
});
// CARTO's Dark Matter style, served as keyless vector tiles by OpenFreeMap and
// rendered through maplibre-gl-leaflet (CARTO's own raster tiles started
// watermarking without an API key in Sep 2026). Dark only — the page is dark,
// so no light variant; satellite and terrain stay switchable. The layer adds
// the OSM/OpenFreeMap credit to the attribution control itself.
var cartoDark=L.maplibreGL({style:'https://tiles.openfreemap.org/styles/dark',maxZoom:20}).addTo(map);
var sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri, Maxar'});
var topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'&copy; OpenTopoMap'});
var gWind=L.layerGroup().addTo(map), gTurb=L.layerGroup().addTo(map),
    gSolar=L.layerGroup().addTo(map), gDgegSolar=L.layerGroup().addTo(map),
    gDgegTurb=L.layerGroup().addTo(map), gPlan=L.layerGroup().addTo(map);
// Historic burned-area scars (ICNF). Two layers, because one file cannot be both
// complete and loadable: the Gardunha one is every fire 2014–2025 at full
// resolution but only around the range (~500 KB), the 2025 one is the whole
// country but thinned to scars >=5 ha with ~100 m outlines (~350 KB). Both are
// off by default, fetched from our own mirror the first time they are switched
// on, and drawn in a pane beneath the project markers. What each one leaves out
// is spelled out in `burnnote` under the layer control — a reader who sees an
// empty Alentejo has to be able to tell "nothing burned" from "not loaded".
map.createPane('burn'); map.getPane('burn').style.zIndex=350;
// The national layer is one year at a time, chosen on a year strip. Two reasons,
// and the second is the stronger one:
//   weight — the reader downloads only the year they are looking at. Gzipped that
//     is 21 KB (2014) to 258 KB (2017), ~50 KB typically, against 904 KB for all
//     twelve. A year already fetched stays in `ardCache`, so stepping back and
//     forth through the record costs nothing after the first pass.
//   legibility — twelve years of scars in one colour is mush. They overlap
//     heavily, and a reader cannot tell a 2017 burn from a 2025 one, which is
//     precisely the question the layer exists to answer.
var ARD_YEARS=[2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025];
var gArdNat=L.layerGroup(),
    ardYear=2025, ardCache={}, ardInflight={}, ardPending=null;
// Age ramp for the "all years" view. One hue, light to dark: the current year
// keeps the layer's own orange and each step back is darker, so twelve years of
// overlapping scars read as a depth of field instead of the mush a single colour
// would give. Newer years are drawn last, so a recent burn is never buried under
// an old one it overlaps.
var ARD_NEW={line:'#9a3412',fill:'#ea580c'}, ARD_OLD={line:'#3f1206',fill:'#7c2d12'};
function mix(a,b,f){
  var pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16), o='#';
  for(var i=16;i>=0;i-=8){
    var ca=(pa>>i)&255, cb=(pb>>i)&255, c=Math.round(ca+(cb-ca)*f);
    o+=(c<16?'0':'')+c.toString(16);
  }
  return o;
}
function ardStyle(y){
  var i=ARD_YEARS.indexOf(y);
  if(i<0 || ARD_YEARS.length<2) return ARD_NEW;
  var f=1-(i/(ARD_YEARS.length-1));   // 0 for the newest year, 1 for the oldest
  return {line:mix(ARD_NEW.line,ARD_OLD.line,f), fill:mix(ARD_NEW.fill,ARD_OLD.fill,f)};
}
// Redrawn on every language switch too — the popups carry a translated cause.
function scar(a, year, group, style, opacity){
  L.polygon(a.rings,{pane:'burn',color:style.line,weight:1,fillColor:style.fill,
                     fillOpacity:(opacity==null?.28:opacity)})
    .bindPopup('<b>'+t('burn_pop')+' · '+year+'</b>'
      +(a.concelho?'<br>'+esc(a.concelho):'')+(a.area_ha?' · '+a.area_ha+' ha':'')
      +(a.cause?'<br>'+esc(tr(a.cause)):'')).addTo(group);
}
function drawArdNat(){
  gArdNat.clearLayers();
  if(ardYear==='all'){
    // Oldest first so the newest scar wins where they overlap.
    ARD_YEARS.forEach(function(y){
      var d=ardCache[y]; if(!d) return;
      var st=ardStyle(y);
      (d.areas||[]).forEach(function(a){ scar(a,d.year,gArdNat,st,.34); });
    });
    return;
  }
  var d=ardCache[ardYear];
  if(!d) return;
  (d.areas||[]).forEach(function(a){ scar(a,d.year,gArdNat,ARD_NEW); });
}
// One fetch per year, ever. Both the click path and the background prefetch go
// through here, so clicking a year the prefetcher is already pulling joins that
// request instead of starting a second one.
function loadYear(y){
  if(ardCache[y]) return Promise.resolve(ardCache[y]);
  if(ardInflight[y]) return ardInflight[y];
  var p=fetch(ARD_NAT_URL.replace('{y}',y))
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ ardCache[y]=d; delete ardInflight[y]; return d; },
          function(e){ delete ardInflight[y]; throw e; });
  ardInflight[y]=p;
  return p;
}
// Selecting a year while an earlier one is still in flight is normal — the reader
// clicks along the strip faster than 2017 downloads. `ardPending` is the year the
// reader last asked for, so a response that arrives after they moved on is cached
// but not drawn: the map always shows the year currently selected, never the last
// one to finish loading.
function selectArdYear(y){
  ardYear=y; ardPending=y;
  syncYearStrip();
  if(y==='all'){
    // Draw whatever is already in memory straight away, then fill the rest in as
    // it lands — the prefetch usually means there is nothing left to wait for.
    drawArdNat();
    ARD_YEARS.forEach(function(yy){
      if(ardCache[yy]) return;
      loadYear(yy).then(function(){ if(ardPending==='all'){ drawArdNat(); syncYearStrip(); } },
                        function(){});
    });
    return;
  }
  if(ardCache[y]){ drawArdNat(); return; }
  gArdNat.clearLayers();
  loadYear(y).then(function(){ if(ardPending===y){ drawArdNat(); syncYearStrip(); } },
                   function(){ if(ardPending===y) syncYearStrip(true); });
}
// All twelve years are pulled in the background as soon as the map's own data has
// rendered, so the layer and every year switch are instant when the reader gets
// there. Comparing planned wind and solar against the fire record is what this map
// is FOR — treating the scar layer as an unlikely extra and making people wait for
// it on first click would be optimising for the visitor who does not exist.
//
// Started after data.json resolves, not on DOMContentLoaded: that file is ~7 MB
// and these 904 KB must not slow down the thing the reader is looking at first.
// Nearest-year-first, because the next click is almost always a neighbour. One at
// a time and on idle callbacks, so the prefetch never competes with map tiles or
// with a year the reader actually asked for.
var ardPrefetching=false;
function idle(fn){ (window.requestIdleCallback||function(f){return setTimeout(f,300);})(fn,{timeout:3000}); }
function prefetchYears(){
  if(ardPrefetching) return;
  // Metered or 2G connections keep the on-demand behaviour: one year, when asked.
  var c=navigator.connection;
  if(c && (c.saveData || /(^|\W)(slow-)?2g$/.test(c.effectiveType||''))) return;
  ardPrefetching=true;
  var anchor=(ardYear==='all')?ARD_YEARS[ARD_YEARS.length-1]:ardYear;
  var queue=ARD_YEARS.slice().sort(function(a,b){
    return Math.abs(a-anchor)-Math.abs(b-anchor);
  });
  (function next(){
    var y=null;
    while(queue.length && y===null){ var c2=queue.shift(); if(!ardCache[c2]) y=c2; }
    if(y===null){ syncYearStrip(); return; }
    loadYear(y).then(function(){ syncYearStrip(); }, function(){})
               .then(function(){ idle(next); });
  })();
}
map.on('overlayadd', function(e){
  if(e.layer===gArdNat){ selectArdYear(ardYear); idle(prefetchYears); }
});
// The note and the year strip are only worth their space while a scar layer is on.
function syncBurnNote(){
  var n=document.getElementById('burnnote');
  if(n) n.hidden=!map.hasLayer(gArdNat);
  var s=document.getElementById('yearstrip');
  if(s) s.hidden=!map.hasLayer(gArdNat);
}
// Marks the selected year, flags a year still downloading so a slow 2017 does not
// read as an empty one, and brightens years already in memory — which makes the
// background prefetch legible: the strip fills in as the years land.
function syncYearStrip(failed){
  var s=document.getElementById('yearstrip'); if(!s) return;
  var allIn=ARD_YEARS.every(function(y){ return !!ardCache[y]; });
  [].forEach.call(s.querySelectorAll('button'), function(b){
    var raw=b.getAttribute('data-year'), isAll=(raw==='all'), y=isAll?'all':+raw;
    var on=(y===ardYear), have=isAll?allIn:!!ardCache[y];
    b.className = on ? 'on' : '';
    b.setAttribute('aria-pressed', on?'true':'false');
    b.classList.toggle('ready', have);
    b.classList.toggle('loading', on && !have && !failed);
  });
}
map.on('overlayadd overlayremove', syncBurnNote);

// Zoomed out to the whole country, 2 800 individual turbines and 200 licensed
// points stop being information and become texture — the farm outlines already
// say where the wind estate is. So the per-unit layers are held back until the
// view is regional, and the checkbox state the reader chose is remembered:
// `wanted` is what they asked for, the map shows it only when the zoom earns it.
var DETAIL_ZOOM=9;
var detail=[gTurb,gDgegTurb], wanted=[true,true], syncing=false;
function syncDetail(){
  var show=map.getZoom()>=DETAIL_ZOOM;
  syncing=true;
  detail.forEach(function(g,i){
    var has=map.hasLayer(g);
    if(show&&wanted[i]&&!has) map.addLayer(g);
    else if((!show||!wanted[i])&&has) map.removeLayer(g);
  });
  syncing=false;
  // A wind farm outline is a 6%-fill dashed hull: legible when you are on top of
  // it, invisible from orbit. With the turbines hidden it has to carry the layer
  // on its own, so from country view it becomes a solid patch.
  gWind.eachLayer(function(l){
    if(l._near&&l.setStyle) l.setStyle(show?l._near:{weight:1,dashArray:null,fillOpacity:.34});
  });
  var h=document.getElementById('detailhint'); if(h) h.hidden=show;
}
map.on('zoomend', syncDetail);
map.on('overlayadd overlayremove', function(e){
  if(syncing) return;
  var i=detail.indexOf(e.layer); if(i<0) return;
  wanted[i]=(e.type==='overlayadd');
});

// Colour swatch prepended to each overlay label, so the toggle control doubles
// as the legend — every row is a colour key AND a checkbox to show/hide it.
function sw(c){return '<span style="display:inline-block;width:11px;height:11px;background:'+c
  +';border-radius:3px;margin:0 7px 0 1px;vertical-align:-1px"></span>';}

function buildControls(){
  if(ctlLayers) map.removeControl(ctlLayers);
  var b={},o={};
  b[t('base_map')]=cartoDark; b[t('base_sat')]=sat; b[t('base_topo')]=topo;
  o[sw('#4a9eff')+t('l_wind')]=gWind; o[sw('#4a9eff')+t('l_turb')]=gTurb; o[sw('#c94f7c')+t('l_dturb')]=gDgegTurb;
  o[sw('#fbbf24')+t('l_solar')]=gSolar; o[sw('#fbbf24')+t('l_dsolar')]=gDgegSolar; o[sw('#f87171')+t('l_plan')]=gPlan;
  o[sw('#ea580c')+t('l_ardnat')]=gArdNat;
  ctlLayers=L.control.layers(b,o,{collapsed:false}).addTo(map);
  var _pl=document.getElementById('panel-layers');
  if(_pl){
    _pl.innerHTML='';
    _pl.appendChild(ctlLayers.getContainer());
    var h=document.createElement('div');
    h.id='detailhint'; h.className='detailhint'; h.innerHTML=t('detailhint');
    h.hidden=map.getZoom()>=DETAIL_ZOOM;
    _pl.appendChild(h);
    var ys=document.createElement('div');
    ys.id='yearstrip';
    ys.innerHTML='<span class="lbl">'+t('burn_year')+'</span>'
      + ARD_YEARS.map(function(y){
          return '<button type="button" data-year="'+y+'">'+y+'</button>';
        }).join('')
      + '<button type="button" data-year="all" class="all">'+t('burn_all')+'</button>';
    ys.addEventListener('click', function(ev){
      var b=ev.target.closest('button[data-year]'); if(!b) return;
      var raw=b.getAttribute('data-year');
      selectArdYear(raw==='all'?'all':+raw);
    });
    _pl.appendChild(ys);
    var bn=document.createElement('div');
    bn.id='burnnote'; bn.className='detailhint'; bn.innerHTML=t('burnnote');
    _pl.appendChild(bn);
  }
  syncDetail(); syncBurnNote(); syncYearStrip();
}

// Burned-land overlap, computed offline by burn_join.py against the full ICNF
// record. It is read from its OWN file rather than from fields merged into
// data.json: build_map.py rewrites data.json wholesale, so anything merged in
// afterwards disappears the moment someone runs the builder on its own. Keyed
// exactly as burn_join.py writes it — "dgeg:<name>" / "osm:<id>".
var BURNS=null, BURNIDX={};
function burnIndex(b){
  BURNIDX={};
  (b&&b.plants||[]).forEach(function(r){BURNIDX[r.key]=r;});
}
function burnRow(key){
  var r=BURNIDX[key]; if(!r) return null;
  var when={burned_then_built:'bw_pre',burned_after_built:'bw_post',both:'bw_both',date_unknown:'bw_unk'}[r.when];
  var years=(r.burns||[]).map(function(x){return x.year;});
  return Math.round(r.burned_frac*100)+'% · '+r.burned_ha+' ha · '+years.join(', ')
    +'<br><span class="note" style="font-size:11.5px">'+t(when)+'</span>';
}

function burnBox(s){
  var el=document.getElementById('burnbox'); if(!el) return;
  if(!s||!s.by_kind){el.hidden=true;return;}
  var pc=function(x){return x==null?'—':(x*100).toFixed(1).replace('.',t('dec'))+'%';};
  var line=function(label,k){
    var b=s.by_kind[k]; if(!b||b.observed_share==null) return '';
    var over=b.ratio_local>1;
    return '<div class="row"><span>'+label+'</span><b>'+pc(b.observed_share)
      +' <span class="x'+(over?' over':'')+'">'+t('b_ratio')(String(b.ratio_local).replace('.',t('dec')))+'</span></b></div>'
      +'<div class="row" style="border-top:0;padding-top:0;color:var(--muted)"><span>'+t('b_exp')+'</span><span>'+pc(b.expected_share_local)+'</span></div>';};
  el.innerHTML='<h3>'+t('b_h')+'</h3>'
    +'<div class="row"><span>'+t('b_country')+' '+s.years[0]+'–'+s.years[1]+'</span><b>'+pc(s.baseline_burned_share)+'</b></div>'
    +line(t('solar'),'solar')+line(t('wind'),'wind')
    +'<div class="cav">'+t('b_cav')+'</div>';
  el.hidden=false;
}

var STATE={'construído':{c:'#7a8a7a',fill:.05,dash:'2 6'},
  'aprovado, por construir':{c:'#f87171',fill:.22,dash:null},
  'linha/subestação — não verificável':{c:'#a78bfa',fill:.08,dash:'8 6'},
  'sem geometria publicada':{c:'#f87171',fill:.22,dash:null}};

function render(){
  var d=DATA; if(!d) return;
  [gWind,gTurb,gSolar,gDgegSolar,gDgegTurb,gPlan].forEach(function(g){g.clearLayers();});
  targets={};
  buildControls();

  d.plants.forEach(function(p,i){
    var w=p.kind==='wind', col=w?'#4a9eff':'#fbbf24';
    var poly=L.polygon(p.rings,{color:col,weight:p.parent?1:2,dashArray:w?'6 5':null,fillOpacity:w?0.06:0.28});
    // close-up style, restored by syncDetail() once the view is regional again
    poly._near={weight:p.parent?1:2,dashArray:w?'6 5':null,fillOpacity:w?0.06:0.28};
    var xr=(p.xref||[]).map(function(x){
      return '<li>'+esc(tr(x.source))+': '+esc(x.name||'—')+(x.mw?' · '+x.mw+' MW':'')
        +(x.dist_km!=null?' · '+t('fromcentre')(x.dist_km):'')
        +(x.url?' · <a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+t('src_link')+'</a>':'')+'</li>';}).join('');
    poly.bindPopup('<h3>'+esc(trName(p.name)||t('noname'))+'</h3><table>'+rowsOf([
      [t('f_type'),w?t('wind'):t('solar')],[t('f_power'),p.mw?p.mw+' MW':null],[t('f_operator'),esc(p.operator)],
      [t('f_since'),esc(p.start)],[t('f_turbines'),p.n_turbines],[t('f_area'),p.area_ha+' ha'],
      [t('f_centre'),p.centre[0].toFixed(5)+', '+p.centre[1].toFixed(5)],
      [t('f_burn'),burnRow('osm:'+p.id)],
      [t('f_subparkof'),esc(trName(p.parent))]])+'</table>'
      +'<div>'+t('source')+': <a href="'+p.url+'" target="_blank" rel="noopener">OpenStreetMap '+esc(p.id)+'</a></div>'
      +(xr?'<div class="note">'+t('confirmed_by')+'<ul style="margin:4px 0 0;padding-left:18px">'+xr+'</ul></div>'
          :'<div class="note">'+t('no_indep')+'</div>')
      +(w?'<div class="note">'+t('hull_note')+'</div>':''));
    poly.addTo(w?gWind:gSolar); targets['p'+i]=poly;
  });

  d.turbines.forEach(function(x){
    var ok=!!x.dgeg;
    L.circleMarker([x.lat,x.lon],{radius:3,color:ok?'#4a9eff':'#c08a2a',weight:1,
      fillColor:ok?'#0b2540':'#3a2a08',fillOpacity:.9})
     .bindPopup('<h3>'+t('turbine')+'</h3><table>'+rowsOf([
       [t('f_park_osm'),esc(trName(x.park))],[t('f_power'),x.mw?x.mw+' MW':null],[t('f_height'),esc(x.height)],
       [t('f_model'),esc(x.model)],[t('f_coords'),x.lat.toFixed(5)+', '+x.lon.toFixed(5)],
       [t('f_attrib'),esc(trSrc(x.park_src))]])+'</table>'
       +'<div>'+t('source')+': <a href="https://www.openstreetmap.org/'+x.id+'" target="_blank" rel="noopener">OSM '+esc(x.id)+'</a></div>'
       +(ok?'<div class="note">'+t('dgeg_ok')+' <b>'+esc(x.dgeg.park)+(x.dgeg.sub?' / '+esc(x.dgeg.sub):'')+'</b>, '
            +t('dgeg_proc')+' '+esc(x.dgeg.processo)+', '+esc(x.dgeg.owner)+', '
            +(x.dgeg.kw?x.dgeg.kw+' kW':'')+(x.dgeg.since?t('dgeg_since')+' '+x.dgeg.since:'')+'. '
            +t('dgeg_offset')+' <b>'+x.dgeg.offset_m+' m</b>.</div>'
          :'<div class="note">'+t('dgeg_none')+'</div>'))
     .addTo(gTurb);
  });

  (d.dgeg_turbines||[]).forEach(function(x){
    L.circleMarker([x.lat,x.lon],{radius:4,color:'#c94f7c',weight:2,fillColor:'#c94f7c',fillOpacity:.5})
     .bindPopup('<h3>'+t('turbine_lic')+'</h3><div class="note">'+t('dgeg_only_note')+'</div><table>'+rowsOf([
       [t('f_park'),esc(x.park)+(x.sub?' / '+esc(x.sub):'')],[t('f_owner'),esc(x.owner)],
       [t('f_power'),x.kw?x.kw+' kW':null],[t('f_blade'),x.blade_r?x.blade_r+' m':null],
       [t('f_over'),esc(x.over)],[t('f_since'),esc(x.since)],[t('f_concelho'),esc(x.concelho)],
       [t('f_processo'),esc(x.processo)],[t('f_coords'),x.lat.toFixed(5)+', '+x.lon.toFixed(5)]])+'</table>'
       +'<div>'+t('source')+': <a href="https://servergeo.dgeg.gov.pt/arcgis/rest/services/Visualizadores/CE/MapServer" target="_blank" rel="noopener">DGEG — Centrais Eólicas</a></div>')
     .addTo(gDgegTurb);
  });

  (d.dgeg_solar||[]).forEach(function(s,i){
    var poly=L.polygon(s.rings,{color:'#ff8c1a',weight:2,fillOpacity:.30});
    poly.bindPopup('<h3>'+esc(s.name)+'</h3><table>'+rowsOf([
      [t('f_type'),t('pv')],[t('f_installed'),s.mva?s.mva+' MVA':null],[t('f_owner'),esc(s.owner)],
      [t('f_blocks'),s.blocks],[t('f_blockarea'),s.area_ha+' ha'],[t('f_concelho'),esc(s.concelho)],
      [t('f_since'),esc(s.since)],[t('f_processo'),esc(s.processo)],
      [t('f_centre'),s.centre[0].toFixed(5)+', '+s.centre[1].toFixed(5)],
      [t('f_burn'),burnRow('dgeg:'+s.name)]])+'</table>'
      +'<div>'+t('source')+': <a href="https://servergeo.dgeg.gov.pt/arcgis/rest/services/Visualizadores/CS/MapServer" target="_blank" rel="noopener">DGEG — Centrais Solares</a> '+t('reg_note')+'</div>');
    poly.addTo(gDgegSolar); targets['d'+i]=poly;
  });

  d.planned.forEach(function(p,i){
    if(p.lat==null) return;
    var st=STATE[p.state]||STATE['aprovado, por construir'];
    var body='<h3>'+esc(trName(p.name))+'</h3><table>'+rowsOf([
      [t('f_situation'),'<b style="color:'+st.c+'">'+esc(tr(p.state))+'</b>'],[t('f_type'),esc(tr(p.type))],
      [t('f_aia'),p.n_aia],[t('f_decision'),esc(tr(p.status))],
      [t('f_cp'),p.cp_start?esc(p.cp_start)+t('to')+esc(p.cp_end||'?'):null],
      [t('f_promoter'),esc(tr(p.promoter))],[t('f_licensor'),esc(tr(p.licensor))],[t('f_munis'),esc(tr(p.municipality))],
      [t('f_studyarea'),p.area_ha?p.area_ha+' ha':null],
      [t('f_centre'),p.lat.toFixed(5)+', '+p.lon.toFixed(5)]])+'</table>'
      +'<div class="note">'+esc(tr(p.built_note||''))+'</div>'
      +'<div class="note">'+t('precision')+' '+esc(tr(p.precision))+'</div>'
      +'<div class="note">'+esc(tr(p.notes||''))+'</div>'
      +'<div class="note">'+t('sources')+':<br>'+(p.sources||[]).map(function(s){
          return '<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(tr(s.title))+'</a>'+(s.date?' — '+esc(s.date):'');}).join('<br>')+'</div>';
    var obj = (p.rings&&p.rings.length)
      ? L.polygon(p.rings,{color:st.c,weight:2,dashArray:st.dash,fillOpacity:st.fill})
      : L.circleMarker([p.lat,p.lon],{radius:9,color:st.c,weight:2,fillOpacity:.35});
    obj.bindPopup(body).addTo(gPlan); targets['n'+i]=obj;
  });

  /* ---- sidebar */
  var sec=function(title,items){return items.length?'<h2>'+title+'</h2>'+items.join(''):'';};
  var plantItem=function(p,i){return '<div class="item" data-t="p'+i+'">'
      +'<span class="pill '+p.kind+'">'+(p.kind==='wind'?t('wind'):t('solar'))+'</span>'
      +'<b>'+esc(trName(p.name)||t('noname'))+'</b>'
      +'<span class="pill '+((p.xref||[]).length?'ok':'unk')+'">'+((p.xref||[]).length?t('p_conf'):t('p_osmonly'))+'</span>'
      +'<div class="meta">'+(p.mw?p.mw+' MW · ':'')+(p.n_turbines?p.n_turbines+' '+t('m_turbines')+' · ':'')
      +p.area_ha+' ha'+(p.parent?' · '+t('m_subpark'):'')+'</div></div>';};
  var planItem=function(p,i){
    var meta=[];
    if(p.area_ha) meta.push(p.area_ha+' ha');
    if(p.dist_km==null) meta.push(t('m_nocoords'));
    if(p.n_aia) meta.push('AIA '+p.n_aia);
    return '<div class="item" data-t="n'+i+'">'
      +'<span class="pill plan">'+esc(tr(p.type))+'</span><b>'+esc(trName(p.name))+'</b>'
      +'<div class="meta">'+(p.promoter?esc(tr(p.promoter))+' · ':'')+esc(tr(p.status))+'</div>'
      +'<div class="meta">'+meta.join(' · ')+'</div></div>';};
  var idx=d.plants.map(function(p,i){return [p,i];});
  var byKind=function(k,sub){return idx.filter(function(a){return a[0].kind===k && (sub?a[0].parent:!a[0].parent);})
    .sort(function(a,b){return (b[0].area_ha||0)-(a[0].area_ha||0);});};
  var pIdx=d.planned.map(function(p,i){return [p,i];});
  var byState=function(s){return pIdx.filter(function(a){return a[0].state===s;});};
  document.getElementById('side').innerHTML=
    sec(t('s_unbuilt')+' ('+byState('aprovado, por construir').length+')',
      byState('aprovado, por construir').map(function(a){return planItem(a[0],a[1]);}))+
    sec(t('s_nogeom')+' ('+byState('sem geometria publicada').length+')',
      byState('sem geometria publicada').map(function(a){return planItem(a[0],a[1]);}))+
    sec(t('s_lines')+' ('+byState('linha/subestação — não verificável').length+')',
      byState('linha/subestação — não verificável').map(function(a){return planItem(a[0],a[1]);}))+
    sec(t('s_done')+' ('+byState('construído').length+')',
      byState('construído').map(function(a){return planItem(a[0],a[1]);}))+
    sec(t('s_wind')+' ('+byKind('wind',false).length+')',byKind('wind',false).map(function(a){return plantItem(a[0],a[1]);}))+
    sec(t('s_dsolar')+' ('+(d.dgeg_solar||[]).length+')',(d.dgeg_solar||[]).map(function(s,i){
      return '<div class="item" data-t="d'+i+'"><span class="pill solar">'+t('solar')+'</span><b>'+esc(s.name)+'</b>'
        +'<span class="pill ok">'+t('p_official')+'</span><div class="meta">'+(s.mva?s.mva+' MVA · ':'')
        +s.area_ha+' ha · '+s.blocks+' '+t('m_blocks')+'</div></div>';}))+
    sec(t('s_subs')+' ('+byKind('wind',true).length+')',byKind('wind',true).map(function(a){return plantItem(a[0],a[1]);}))+
    sec(t('s_osmsolar')+' ('+byKind('solar',false).length+')',byKind('solar',false).map(function(a){return plantItem(a[0],a[1]);}));

  /* ---- KPIs, prose, sources */
  var s=d.stats;
  var solarOSM=d.plants.filter(function(p){return p.kind==='solar';}).length;
  var kpi=function(n,l,c){return '<div class="kpi '+(c||'')+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';};

  // Planned projects are not a third technology — every one of them is a wind
  // farm, a solar plant or the grid that carries them away. So they are counted
  // inside the tab they belong to; a hybrid is genuinely both and is counted in
  // both. Lines and substations belong to neither and are noted under both.
  var plKind=function(p,k){
    var ty=String(p.type||'');
    if(ty.indexOf('híbrido')>=0) return true;
    return k==='wind' ? ty.indexOf('eólico')>=0 : ty.indexOf('solar')>=0;
  };
  var plannedOf=function(k){return d.planned.filter(function(p){return plKind(p,k);});};
  var unbuiltOf=function(k){return plannedOf(k).filter(function(p){return p.state==='aprovado, por construir';});};
  var other=d.planned.filter(function(p){return !plKind(p,'wind')&&!plKind(p,'solar');}).length;
  var note=other?'<div class="foot-note">'+fmtN(other)+' · '+t('k_lines')+'</div>':'';

  var TAB={
    wind:[kpi(fmtN(s.turbines),t('k_turb')),kpi(fmtN(s.turbines_confirmed),t('k_conf')),
          kpi(fmtN(s.dgeg_only),t('k_only')),kpi(s.median_offset_m+' m',t('k_off')),
          kpi(fmtN(plannedOf('wind').length),t('k_plan')),
          kpi(fmtN(unbuiltOf('wind').length),t('k_unbuilt'),'hot'),note],
    solar:[kpi(fmtN(solarOSM),t('l_solar')),kpi(fmtN((d.dgeg_solar||[]).length),t('l_dsolar')),
          kpi(fmtN(plannedOf('solar').length),t('k_plan')),
          kpi(fmtN(unbuiltOf('solar').length),t('k_unbuilt'),'hot'),note]
  };
  var meta=[['wind',t('wind'),s.turbines+s.dgeg_only],['solar',t('solar'),solarOSM+(d.dgeg_solar||[]).length]];
  var tots=meta.map(function(m){return '<div class="tot"><div class="tot-n">'+fmtN(m[2])+'</div><div class="tot-l">'+m[1]+'</div></div>';}).join('');
  var tbtns=meta.map(function(m,i){return '<button class="tabbtn'+(i===0?' on':'')+'" data-tab="'+m[0]+'">'+m[1]+'</button>';}).join('');
  document.getElementById('kpis').innerHTML='<div class="tots">'+tots+'</div><div class="tabbtns">'+tbtns+'</div><div class="kpis-grid" id="tabbody"></div>';
  var showTab=function(k){document.getElementById('tabbody').innerHTML=TAB[k].join('');
    document.querySelectorAll('#kpis .tabbtn').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tab')===k);});};
  document.querySelectorAll('#kpis .tabbtn').forEach(function(b){b.addEventListener('click',function(){showTab(b.getAttribute('data-tab'));});});
  showTab('wind');
  document.getElementById('method1').innerHTML=t('method1')(d);
  document.getElementById('method2').innerHTML=t('method2')(d);
  document.querySelector('[data-i18n="built_note"]').innerHTML=t('built_note')(d);
  document.getElementById('srcgrid').innerHTML=(SRC[lang]||SRC.pt).map(function(c){
    return '<div class="srccard"><div class="who">'+c.who+'</div><h4><a href="'+c.u+'" target="_blank" rel="noopener">'+c.h+'</a></h4><p>'+c.p+'</p></div>';}).join('');
  document.getElementById('limits').innerHTML=t('limits').map(function(x){return '<li>'+x+'</li>';}).join('');
  burnBox(BURNS&&BURNS.stats);
  drawArdNat();
}

document.getElementById('side').addEventListener('click',function(ev){
  var el=ev.target.closest?ev.target.closest('.item'):null; if(!el) return;
  var x=targets[el.getAttribute('data-t')]; if(!x) return;
  if(x.getBounds) map.fitBounds(x.getBounds(),{maxZoom:14}); else map.setView(x.getLatLng(),13);
  x.openPopup();
});

function applyLang(l){
  lang=l; try{localStorage.setItem('nf_lang',l);}catch(e){}
  document.documentElement.lang=l;
  var s=STR[l];
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var k=el.getAttribute('data-i18n'); if(typeof s[k]==='string') el.innerHTML=s[k];});
  document.querySelectorAll('#langsw button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-l')===l);});
  render();
}
document.querySelectorAll('#langsw button').forEach(function(b){
  b.addEventListener('click',function(){applyLang(b.getAttribute('data-l'));});});

applyLang(lang);
(function(){var pn=document.getElementById('panel');document.getElementById('panelBtn').addEventListener('click',function(){pn.hidden=!pn.hidden;});document.getElementById('panelClose').addEventListener('click',function(){pn.hidden=true;});})();
// Both files are wanted before the first draw — the popups are built once, so a
// late burns.json would leave them without the burned-land row. A failed burns
// fetch is not fatal: the map draws, the burn row and the panel card stay away.
Promise.all([
  fetch(DATA_URL).then(function(r){return r.json();}),
  fetch(BURNS_URL).then(function(r){return r.json();}).catch(function(){return null;})
]).then(function(x){DATA=x[0];BURNS=x[1];burnIndex(BURNS);render();idle(prefetchYears);})
  .catch(function(){document.getElementById('side').innerHTML='<p class="meta">—</p>';});
})();
</script>
</body>
</html>
